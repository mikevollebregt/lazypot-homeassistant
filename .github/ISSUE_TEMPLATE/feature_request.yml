name: Feature request
description: Suggest an improvement to the Home Assistant integration
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [public roadmap](https://lazypot.nl/roadmap) first.
        If your idea is already there, voting and commenting on it is the fastest way to get it built.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe what you are trying to achieve in Home Assistant, not only the feature.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Entities, services, card, blueprint, anything that would help.
    validations:
      required: false
  - type: input
    id: roadmap-item
    attributes:
      label: Related roadmap item (if any)
      placeholder: "https://lazypot.nl/roadmap/..."
    validations:
      required: false
